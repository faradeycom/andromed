<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Андромед — діагностичний центр</title>
<meta name="description" content="Консультативно-діагностичний центр «Андромед»: консультації спеціалістів і УЗД без черг. Запис за тел. 097-918-65-93.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F8F8; --surface:#FFFFFF; --surface2:#EDF3F3; --ink:#10222B; --muted:#55666E; --line:#D6E1E2;
  --accent:#0E8C8C; --accent-ink:#FFFFFF; --accent-soft:#DDF1F0;
  --space:#0B1A2E; --space2:#132A45; --star:#F3D27A;
  --display:"Unbounded","Arial Black",sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A141B; --surface:#111F28; --surface2:#172A35; --ink:#E4EEF0; --muted:#93A6AD; --line:#233844;
    --accent:#3CC4C0; --accent-ink:#06201F; --accent-soft:#12343A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A141B; --surface:#111F28; --surface2:#172A35; --ink:#E4EEF0; --muted:#93A6AD; --line:#233844;
  --accent:#3CC4C0; --accent-ink:#06201F; --accent-soft:#12343A;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 15px var(--body);border-radius:999px;padding:12px 22px;border:1.5px solid transparent;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.line{border-color:currentColor;background:transparent}
.btn svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* header */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--space) 92%,transparent);backdrop-filter:blur(10px);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:34px;height:34px;flex:none}
.logo b{font:700 17px var(--display);letter-spacing:.06em}
.logo small{display:block;font:500 10px var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.65}
nav.menu{display:flex;gap:20px;margin-left:auto;font-weight:600;font-size:14px}
nav.menu a{text-decoration:none;opacity:.8}
nav.menu a:hover{opacity:1}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:#fff;font:700 12px var(--body);padding:6px 10px;cursor:pointer;opacity:.7}
.lang button.on{background:#fff;color:var(--space);opacity:1}
.tel{font-weight:700;text-decoration:none;white-space:nowrap}
@media (max-width:900px){nav.menu{display:none}.tel{margin-left:auto}}
@media (max-width:480px){.tel{display:none}.lang{margin-left:auto}}

/* hero */
.hero{background:radial-gradient(1200px 500px at 80% -10%,var(--space2),transparent),var(--space);color:#fff;position:relative;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;padding-block:72px 84px;display:grid;grid-template-columns:1.25fr .9fr;gap:40px;align-items:center}
.kicker{font:600 13px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--star)}
.hero h1{font:700 clamp(30px,5vw,54px)/1.08 var(--display);margin:14px 0 16px;letter-spacing:.01em;text-wrap:balance}
.hero p.lead{font-size:18px;opacity:.85;margin:0 0 28px;max-width:34em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.line{color:#fff}
.perks{display:flex;flex-direction:column;gap:12px}
.perk{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 18px}
.perk i{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(243,210,122,.15);color:var(--star);display:grid;place-items:center}
.perk i svg{width:22px;height:22px}
.perk b{display:block;font-size:16px}
.perk span{font-size:14px;opacity:.75}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-block:48px 56px}}

/* today strip */
.today{background:var(--surface);border-bottom:1px solid var(--line)}
.today .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:16px}
.today b{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.dim{background:var(--surface2);color:var(--muted)}

section{padding-block:72px}
h2{font:700 clamp(24px,3.4vw,36px)/1.15 var(--display);margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 32px;max-width:40em}

/* specialists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.doc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.doc h3{font:700 17px var(--display);margin:0;letter-spacing:.01em}
.doc .ico{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.doc .ico svg{width:24px;height:24px}
.days{display:flex;gap:4px}
.days span{flex:1;text-align:center;font:700 11px var(--body);padding:5px 0;border-radius:6px;background:var(--surface2);color:var(--muted);opacity:.6}
.days span.y{background:var(--accent);color:var(--accent-ink);opacity:1}
.hours{font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge-today{font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* schedule table */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
table.sch{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.sch th,.sch td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.sch thead th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sch thead th.td{color:var(--accent)}
.sch tbody th{text-align:left;font-weight:700}
.sch td.y{color:var(--ink);font-weight:600}
.sch td.n{color:var(--line)}
.sch td.td{background:var(--accent-soft)}
.sch tr:last-child>*{border-bottom:0}
.note{font-size:13px;color:var(--muted);margin-top:12px}

.doc .who{font-size:14px;color:var(--muted);margin-top:-6px}
.doc.uzd{grid-column:span 2;background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.uzdlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.uzdlist div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.uzdlist div.on{border-color:var(--accent)}
.uzdlist b{display:block}
.uzdlist small{color:var(--muted)}
@media (max-width:600px){.doc.uzd{grid-column:auto}}
.sch td small{display:block;font-size:12px;color:var(--muted);font-weight:500}

/* prices */
.prices{display:grid;gap:16px}
.pgroup{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pgroup h3{font:700 16px var(--display);margin:0;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface2)}
table.pt{border-collapse:collapse;width:100%;font-size:15px}
.pt th,.pt td{padding:10px 18px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.pt th:first-child,.pt td:first-child{text-align:left}
.pt thead th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-block:10px}
.pt td.p{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;width:1%}
.pt td.p.k{color:var(--accent)}
.pt td.p.e{color:var(--line);font-weight:500}
.pt tr:last-child td{border-bottom:0}
@media (max-width:520px){.pt th,.pt td{padding:9px 10px;font-size:14px}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--space);color:var(--star);font:700 16px var(--display);margin-bottom:14px}
.step b{display:block;font-size:17px;margin-bottom:6px}
.step p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* contacts */
.contacts{background:var(--space);color:#fff}
.contacts .wrap{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
.contacts .sub{color:rgba(255,255,255,.7)}
.cl{display:flex;flex-direction:column;gap:16px}
.ci{display:flex;gap:14px;align-items:flex-start}
.ci i{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--star)}
.ci i svg{width:20px;height:20px}
.ci small{display:block;opacity:.6;font-size:13px}
.ci b{font-size:18px}
.bigtel{font:700 clamp(28px,4.4vw,44px) var(--display);color:var(--star);text-decoration:none;display:inline-block;margin:8px 0 18px}
.ex{font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:rgba(243,210,122,.18);color:var(--star);vertical-align:middle;margin-left:6px}
@media (max-width:760px){.contacts .wrap{grid-template-columns:1fr}}
.ci a{text-decoration:none}
.ci a:hover{text-decoration:underline}

/* map */
.mapsec{background:var(--space);color:#fff;padding-top:0}
.mapbox{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:var(--space2);aspect-ratio:16/7;min-height:320px}
.mapbox iframe{display:block;width:100%;height:100%;border:0}
.maphead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.maphead h2{margin:0}
.maphead p{margin:6px 0 0;color:rgba(255,255,255,.7)}
.mapsec .btn.line{color:#fff}
@media (max-width:600px){.mapbox{aspect-ratio:auto;height:360px}}
footer{background:var(--space);color:rgba(255,255,255,.55);font-size:13px;border-top:1px solid rgba(255,255,255,.08)}
footer .wrap{padding-block:20px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#top" aria-label="Андромед">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="none" stroke="#F3D27A" stroke-opacity=".5"/><path d="M20 7l2.6 8.4L31 18l-8.4 2.6L20 29l-2.6-8.4L9 18l8.4-2.6z" fill="#F3D27A"/><circle cx="30" cy="30" r="1.6" fill="#fff"/><circle cx="10" cy="29" r="1.1" fill="#fff" opacity=".7"/><circle cx="31" cy="9" r="1.1" fill="#fff" opacity=".7"/></svg>

<main id="top">
<div class="hero">

  <div class="wrap">
    <div>
      <div class="kicker" data-t="kicker"></div>
      <h1 data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="cta">
        <a class="btn primary" id="bookBtn" href="prototype/#book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="book"></span></a>
        <a class="btn line" id="callBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg><span data-t="call"></span></a>
        <a class="btn line" href="#map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-t="findUs"></span></a>
      </div>
    </div>
    <div class="perks" id="perks"></div>
  </div>
</div>

<div class="today"><div class="wrap" id="today"></div></div>

<section id="doctors"><div class="wrap">
  <h2 data-t="docsH"></h2>
  <p class="sub" data-t="docsSub"></p>
  <div class="grid" id="docs"></div>
</div></section>

<section id="schedule" style="padding-top:0"><div class="wrap">
  <h2 data-t="schH"></h2>
  <p class="sub" data-t="schSub"></p>
  <div class="tblwrap"><table class="sch" id="sch"></table></div>
  <p class="note" data-t="schNote"></p>
</div></section>

<section id="prices" style="padding-top:0"><div class="wrap">
  <h2 data-t="pricesH"></h2>
  <p class="sub" data-t="pricesSub"></p>
  <div class="prices" id="priceList"></div>
</div></section>

<section id="how" style="padding-top:0"><div class="wrap">
  <h2 data-t="howH"></h2>
  <p class="sub" data-t="howSub"></p>
  <div class="steps" id="steps"></div>
</div></section>

<section class="contacts" id="contacts"><div class="wrap">
  <div>
    <h2 data-t="contH"></h2>
    <p class="sub" data-t="contSub"></p>
    <a class="bigtel" id="telBig"></a><br>
    <div class="cta"><a class="btn primary" href="prototype/#book"><span data-t="book"></span></a><a class="btn line" href="#map" style="color:#fff"><span data-t="findUs"></span></a></div>
  </div>
  <div class="cl" id="cl"></div>
</div></section>

<section class="mapsec" id="map"><div class="wrap">
  <div class="maphead">
    <div><h2 data-t="mapH"></h2><p id="mapAddr"></p></div>
    <div class="cta">
      <a class="btn primary" id="routeBtn" target="_blank" rel="noopener"><span data-t="route"></span></a>
      <a class="btn line" id="gmapBtn" target="_blank" rel="noopener"><span data-t="openMap"></span></a>
    </div>
  </div>
  <div class="mapbox"><iframe id="mapFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
</div></section>
</main>
<footer><div class="wrap"><span id="copy"></span><span data-t="foot"></span></div></footer>

}

// зоряне небо в першому екрані (з сузір'ям Андромеди)
(function stars() {
  const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, pts = [];
  const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(7);
  const andromeda = [[.62,.30],[.70,.36],[.77,.40],[.86,.43],[.70,.24],[.73,.16],[.77,.50]];
  function size() {
    const r = devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * r; cv.height = H * r; ctx.setTransform(r, 0, 0, r, 0, 0);
    pts = Array.from({ length: Math.round(W * H / 5000) }, () => ({ x: rnd() * W, y: rnd() * H, r: rnd() * 1.2 + .2, p: rnd() * 6.28 }));
  }
  function draw(tm) {
    ctx.clearRect(0, 0, W, H);
    for (const s of pts) {
      ctx.globalAlpha = .25 + .5 * (still ? .6 : (Math.sin(tm / 900 + s.p) + 1) / 2);
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    }
    const A = andromeda.map(([x, y]) => [x * W, y * H]);
    ctx.globalAlpha = .35; ctx.strokeStyle = "#F3D27A"; ctx.lineWidth = 1; ctx.beginPath();
    [[0,1],[1,2],[2,3],[1,4],[4,5],[2,6]].forEach(([a, b]) => { ctx.moveTo(...A[a]); ctx.lineTo(...A[b]); });
    ctx.stroke(); ctx.globalAlpha = .9; ctx.fillStyle = "#F3D27A";
    A.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.28); ctx.fill(); });
    if (!still) requestAnimationFrame(draw);
  }
  size(); addEventListener("resize", size); requestAnimationFrame(draw);
})();
